<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img" aria-labelledby="explore-title">
  <title id="explore-title">Line drawing of a folded map with a dotted route leading to a location pin</title>
  <style>
    .ink   { fill: none; stroke: #1d2f4a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .paper { fill: #ffffff; stroke: #1d2f4a; stroke-width: 1.6; stroke-linejoin: round; }
    .shade { fill: #e8eff7; stroke: #1d2f4a; stroke-width: 1.6; stroke-linejoin: round; }
    .route { fill: none; stroke: #8c2a37; stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
    .pin   { fill: #8c2a37; }
    .green { fill: none; stroke: #4c7a62; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .water { fill: none; stroke: #2f5d8a; stroke-width: 1.2; stroke-linecap: round; opacity: .6; }
  </style>

  <!-- folded map: three panels -->
  <path class="paper" d="M20 36 L60 26 L60 118 L20 128 Z"/>
  <path class="shade" d="M60 26 L100 36 L100 128 L60 118 Z"/>
  <path class="paper" d="M100 36 L140 26 L140 118 L100 128 Z"/>

  <!-- map details -->
  <path class="water" d="M26 60 q6 -4 12 0 t12 0 M28 70 q6 -4 12 0 t12 0"/>
  <path class="green" d="M108 104 L116 92 L124 104 M118 104 L126 90 L134 104"/>
  <path class="green" d="M70 56 c4 -6 10 -6 12 0 c-4 4 -8 4 -12 0 Z"/>

  <!-- dotted route ending at a cross -->
  <path class="route" d="M30 110 C44 96 52 100 64 90 C78 78 84 92 98 80 C110 70 112 62 120 58"/>
  <path class="ink" d="M27 107 L33 113 M33 107 L27 113"/>

  <!-- location pin -->
  <path class="pin" d="M120 56 C112 46 110 40 110 36 C110 30 115 26 120 26 C125 26 130 30 130 36 C130 40 128 46 120 56 Z"/>
  <circle cx="120" cy="36" r="3.4" fill="#ffffff"/>
</svg>

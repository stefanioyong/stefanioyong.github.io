<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img" aria-labelledby="golf-title">
  <title id="golf-title">Line drawing of a golf green with a flag, a ball on a tee and a club</title>
  <style>
    .ink   { fill: none; stroke: #1d2f4a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .white { fill: #ffffff; stroke: #1d2f4a; stroke-width: 1.6; }
    .flag  { fill: #8c2a37; }
    .green { fill: none; stroke: #4c7a62; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .tintG { fill: #e7f0ea; }
    .sky   { fill: none; stroke: #2f5d8a; stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
    .dash  { fill: none; stroke: #8c2a37; stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; opacity: .8; }
  </style>

  <!-- clouds -->
  <path class="sky" d="M22 30 c4 -8 14 -8 16 0 c6 -2 10 4 6 8 H20 c-4 -2 -2 -8 2 -8 Z"/>

  <!-- rolling green -->
  <path class="tintG" d="M10 112 C40 92 80 90 150 104 V128 H10 Z"/>
  <path class="green" d="M10 112 C40 92 80 90 150 104"/>
  <path class="green" d="M20 122 C60 112 100 112 144 120"/>

  <!-- hole and flag -->
  <ellipse class="ink" cx="112" cy="100" rx="7" ry="2.2"/>
  <path class="ink" d="M112 100 V30"/>
  <path class="flag" d="M112 30 L136 38 L112 46 Z"/>

  <!-- ball's path to the hole -->
  <path class="dash" d="M46 96 C62 60 92 62 108 94"/>

  <!-- tee and ball -->
  <path class="ink" d="M42 108 H50 M46 108 V118"/>
  <circle class="white" cx="46" cy="102" r="6"/>
  <circle cx="44" cy="100" r=".9" fill="#1d2f4a"/>
  <circle cx="48" cy="101" r=".9" fill="#1d2f4a"/>
  <circle cx="46" cy="104" r=".9" fill="#1d2f4a"/>

  <!-- club resting against the scene -->
  <path class="ink" d="M14 40 L30 106"/>
  <path class="ink" d="M30 106 C32 112 38 114 42 112"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Serif&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: red brand bar, cream page, "next up" banner, then calendar beside the event list (stacks on phones).
   Single light look on purpose — warm gold, cream and charcoal for the fictional Golden Hour Booths brand. */
:root {
  --red: #9a6b1f;
  --red-deep: #7a5416;
  --red-wash: #f3e8d2;
  --cream: #faf7ef;
  --paper: #fffdf8;
  --sand: #f1ebdd;
  --char: #1f1f1f;
  --ink: #1b1a17;
  --muted: #6f695e;
  --rule: rgba(31, 31, 31, .13);
  --on-dark: #faf7ef;
  --on-dark-dim: rgba(250, 247, 239, .65);
  --gold: #c9a95c;
  --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --body: "Asap", "Helvetica Neue", Arial, sans-serif;
  --btn: "PT Serif", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--cream); color: var(--ink); font: 400 16px/1.5 var(--body); letter-spacing: .03em; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.serif { font-family: var(--serif); font-variant-numeric: lining-nums; }

/* header */
.bar { background: var(--red); color: var(--on-dark); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: -.005em; }
.brand span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--on-dark-dim); }
.bar-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.me { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.me select { background: transparent; color: var(--on-dark); border: 1px solid var(--on-dark-dim); padding: 7px 10px; letter-spacing: .03em; text-transform: none; font-size: 15px; border-radius: 0; }
.me select option { color: var(--ink); background: var(--paper); }
.bar .btn { border-color: var(--on-dark); color: var(--on-dark); }
.bar .btn:hover { background: var(--on-dark); color: var(--red); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--char); background: transparent; color: var(--char); font-family: var(--btn); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; border-radius: 0; min-height: 42px; }
.btn:hover { background: var(--char); color: var(--on-dark); }
.btn.solid { background: var(--red); border-color: var(--red); color: var(--on-dark); }
.btn.solid:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn.small { padding: 6px 12px; min-height: 34px; font-size: 13px; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red); color: var(--on-dark); }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--red); font-family: var(--btn); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.linkbtn:hover { text-decoration: underline; }

/* notices */
.notice { background: var(--paper); border-left: 3px solid var(--red); padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 15px; }
.notices { display: grid; gap: 10px; padding-top: 16px; }

/* next up */
.hero { border-bottom: 1px solid var(--rule); }
.hero .wrap { padding-block: 34px 30px; }
.next { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; cursor: pointer; }
.next .eyebrow { color: var(--red); margin: 0 0 10px; }
.next h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(38px, 6.5vw, 68px); line-height: .98; text-transform: uppercase; letter-spacing: -.02em; color: var(--red); text-wrap: balance; font-variant-numeric: lining-nums; }
.next .meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 24px; }
.next .meta b { font-weight: 600; color: var(--red); }
.count { text-align: right; }
.count b { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(60px, 9vw, 104px); line-height: .85; color: var(--red); font-variant-numeric: lining-nums; }
.count b.word { font-size: clamp(34px, 4.5vw, 52px); font-style: italic; text-transform: uppercase; }
.count span { color: var(--muted); }
.next-empty { color: var(--muted); font-family: var(--serif); font-size: 28px; }

/* layout */
.main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 36px; padding-block: 32px 64px; align-items: start; }
.main > * { min-width: 0; }
h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1.05; text-transform: uppercase; letter-spacing: -.01em; font-variant-numeric: lining-nums; text-wrap: balance; }

/* calendar */
.cal { border: 1px solid var(--char); background: var(--paper); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.cal-head { display: flex; align-items: center; justify-content: space-between; background: var(--char); color: var(--on-dark); padding: 8px; }
.cal-head h2 { font-size: 26px; }
.icon { width: 38px; height: 38px; border: 0; background: transparent; color: var(--on-dark); font-size: 18px; }
.icon:hover { background: var(--red); }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { border-bottom: 1px solid var(--rule); }
.dow span { text-align: center; padding: 8px 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.day { aspect-ratio: 1 / 1; min-width: 0; overflow: hidden; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font-size: 14px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.day:nth-child(7n) { border-right: 0; }
.day.other { color: #b9b1a1; background: var(--sand); }
.day .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; }
.day.today .n { background: var(--red); color: var(--on-dark); }
.day.has:hover { background: var(--red-wash); }
.day.sel { outline: 2px solid var(--red); outline-offset: -2px; }
.day:not(.has) { cursor: default; }
.dots { display: flex; gap: 3px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--char); display: inline-block; }
.dot.mine { background: var(--red); }
.cal-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend { display: inline-flex; align-items: center; gap: 6px; }

/* list controls */
.list-head { display: grid; gap: 14px; margin-bottom: 16px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; padding: 10px 14px; border: 1px solid var(--char); background: var(--paper); border-radius: 0; min-height: 42px; }
.seg { display: flex; border: 1px solid var(--char); }
.seg button { border: 0; background: var(--paper); padding: 8px 14px; font-family: var(--btn); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.seg button + button { border-left: 1px solid var(--char); }
.seg button[aria-pressed="true"] { background: var(--char); color: var(--on-dark); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--rule); background: var(--paper); font-size: 13px; }
.chipbtn i { width: 9px; height: 9px; border-radius: 50%; background: var(--bc, var(--char)); }
.chipbtn:hover { border-color: var(--char); }
.chipbtn[aria-pressed="true"] { background: var(--char); border-color: var(--char); color: var(--on-dark); }

/* booth colors */
.b-retro { --bc: #2f4f3a; } .b-studio { --bc: #b85c6e; } .b-roaming { --bc: #d63d21; }
.b-360 { --bc: #1f1f1f; } .b-guestbook { --bc: #6e2430; } .b-monogram { --bc: #a8873f; }
.b-enclosed { --bc: #3a3f63; } .b-keychain { --bc: #8a5a2b; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; background: var(--bc, var(--char)); color: var(--on-dark); }
.tag.b-monogram { background: var(--char); color: var(--gold); font-family: var(--serif); font-weight: 600; font-size: 12px; letter-spacing: .25em; padding: 2px 8px; }
.tag.example { background: transparent; color: var(--muted); outline: 1px dashed var(--muted); outline-offset: -1px; }

/* event cards */
.events { display: grid; gap: 14px; }
.month { color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--rule); margin-top: 8px; }
.card { display: grid; grid-template-columns: 78px minmax(0, 1fr); width: 100%; padding: 0; text-align: left; border: 1px solid var(--rule); background: var(--paper); transition: box-shadow .2s, border-color .2s; }
.card:hover { border-color: var(--char); box-shadow: 0 10px 24px rgba(31, 31, 31, .1); }
.card.mine { border-left: 4px solid var(--red); }
.card.past { opacity: .55; }
.card.cancelled h3 { text-decoration: line-through; }
.date { background: var(--char); color: var(--on-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 4px; }
.card.mine .date { background: var(--red); }
.date .m { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.date .d { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: .95; font-variant-numeric: lining-nums; }
.date .w { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--on-dark-dim); }
.cbody { padding: 14px 16px; min-width: 0; display: grid; gap: 7px; }
.ctop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.1; font-variant-numeric: lining-nums; }
.status { flex: none; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 7px; border: 1px solid currentColor; }
.status.Tentative { color: #946500; } .status.Cancelled { color: var(--red); }
.facts { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 14px; color: var(--muted); }
.facts .arrive { color: var(--red); font-weight: 600; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { font-size: 12px; padding: 2px 10px; border: 1px solid var(--char); }
.person.me { background: var(--red); border-color: var(--red); color: var(--on-dark); }
.empty { padding: 36px 20px; text-align: center; border: 1px dashed rgba(31, 31, 31, .3); color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* dialogs */
dialog { border: 0; padding: 0; width: min(600px, calc(100% - 32px)); max-height: calc(100% - 32px); background: var(--cream); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(31, 31, 31, .7); }
.d-head { background: var(--char); color: var(--on-dark); padding: 22px 56px 20px 24px; position: relative; display: grid; gap: 8px; }
.d-head .eyebrow { color: #f08a72; }
.d-head h3 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1; text-transform: uppercase; font-variant-numeric: lining-nums; }
.d-head .tag.b-360, .d-head .tag.b-monogram { outline: 1px solid var(--on-dark-dim); outline-offset: -1px; }
.x { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border: 0; background: transparent; color: var(--on-dark); font-size: 26px; line-height: 1; }
.x:hover { background: var(--red); }
.times { display: flex; background: #2b2b2b; color: var(--on-dark); }
.times > div { flex: 1; padding: 11px 16px; border-right: 1px solid #3c3c3c; min-width: 0; }
.times > div:last-child { border-right: 0; }
.times span { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--on-dark-dim); }
.times b { display: block; margin-top: 2px; font-size: 15px; font-weight: 600; }
.times .hl { background: var(--red); }
.d-body { padding: 4px 24px 24px; }
.sec { margin: 22px 0 0; color: var(--red); }
dl { margin: 0; }
.row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.row dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.row dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.row dd .venue { font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: 0; }
.row dd .sub { color: var(--muted); }
.row dd a { color: var(--red); }
.copy { margin-left: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }

/* editor form */
.form { padding: 8px 24px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form .full { grid-column: 1 / -1; }
.form .sec { grid-column: 1 / -1; margin: 14px 0 -4px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > span { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.field small { text-transform: none; letter-spacing: .02em; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--char); background: var(--paper); border-radius: 0; min-height: 42px; }
.field textarea { min-height: 72px; resize: vertical; }
/* tick boxes: equal-size tiles in a grid, same-size boxes */
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.checks label { display: flex; align-items: center; gap: 10px; min-height: 46px; border: 1px solid var(--rule); background: var(--paper); padding: 8px 12px; font-size: 14px; line-height: 1.2; cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--char); background: var(--cream); }
.field .checks input { flex: none; width: 20px; height: 20px; min-height: 0; padding: 0; margin: 0; accent-color: var(--red); }
.checks small { grid-column: 1 / -1; }
.form-foot { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.err { color: var(--red); font-size: 14px; }

/* payment */
.pay { flex: none; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 7px; border: 1px solid currentColor; white-space: nowrap; }
.pay-none { color: var(--red); }
.pay-deposit { color: #946500; }
.pay-partial { color: #6e2430; }
.pay-full { color: #2f5d3a; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.money { font-variant-numeric: tabular-nums; }
.due { color: var(--red); font-weight: 600; }
.chipbtn.pf i { display: none; }

/* crew list */
.crew-list { list-style: none; margin: 0; padding: 0; display: grid; }
.crew-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.crew-list li span { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: 0; }
.crew-list li.removed span { text-decoration: line-through; color: var(--muted); }
.crew-add { display: flex; gap: 10px; margin-top: 16px; }
.crew-add input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--char); background: var(--paper); border-radius: 0; min-height: 42px; }
.hint { color: var(--muted); font-size: 14px; margin: 14px 0 0; }
.d-head .head-edit { justify-self: start; border-color: var(--on-dark); color: var(--on-dark); }
.d-head .head-edit:hover { background: var(--on-dark); color: var(--char); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--char); color: var(--on-dark); padding: 12px 18px; max-width: calc(100% - 32px); z-index: 50; font-size: 15px; }

.foot { background: var(--char); color: var(--on-dark-dim); font-size: 14px; }
.foot .wrap { padding-block: 26px; display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; }
.foot b { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--on-dark); text-transform: uppercase; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 24px; }
  .cal { position: static; }
}
@media (max-width: 560px) {
  .brand b { font-size: 24px; }
  .brand span { display: none; }
  .next { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .count { text-align: left; }
  .card { grid-template-columns: 62px minmax(0, 1fr); }
  .date .d { font-size: 32px; }
  .card h3 { font-size: 21px; }
  .day { padding: 3px; font-size: 13px; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .d-head h3 { font-size: 30px; }
  .times > div { padding: 10px; }
  .times b { font-size: 13px; }
  .form { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; }
  .d-body { padding-inline: 16px; }
}
/* phones: compact header, one-line swipeable filters, full-screen popups with a pinned Save */
@media (max-width: 560px) {
  .bar .wrap { padding-block: 8px; flex-wrap: nowrap; }
  .brand b { font-size: 20px; white-space: nowrap; }
  .bar-tools { gap: 6px; flex-wrap: nowrap; }
  .bar .btn.small { padding: 5px 10px; min-height: 36px; font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
  .hero .wrap { padding-block: 20px 18px; }
  .next { gap: 10px; }
  .next h1 { font-size: 34px; }
  .next .meta { margin-top: 10px; gap: 2px 14px; font-size: 15px; }
  .count { display: flex; align-items: baseline; gap: 8px; }
  .count b { font-size: 46px; }
  .count b.word { font-size: 28px; }
  .main { padding-block: 16px 40px; gap: 22px; }
  h2 { font-size: 28px; }
  .cal-head h2 { font-size: 22px; }
  .day { aspect-ratio: auto; height: 46px; }
  .seg { flex: 1 1 100%; }
  .seg button { flex: 1; padding-inline: 8px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .chips::-webkit-scrollbar { display: none; }
  .chipbtn { flex: none; }
  .cbody { padding: 12px; gap: 6px; }
  .ctop { flex-direction: column; gap: 6px; }
  .badges { order: -1; justify-content: flex-start; }
  .card h3 { font-size: 22px; }
  dialog { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; padding-top: env(safe-area-inset-top, 0px); box-shadow: none; }
  .d-head { padding: 18px 60px 16px 16px; }
  .d-head h3 { font-size: 28px; }
  .x { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5; background: var(--char); border: 1px solid var(--on-dark-dim); width: 42px; height: 42px; }
  .times b { font-size: 13px; }
  .d-body { padding: 4px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .actions .btn, .edit-actions .btn { flex: 1 1 auto; }
  .form-foot { position: sticky; bottom: 0; z-index: 3; background: var(--cream); border-top: 1px solid var(--rule);
    margin: 8px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .form-foot .btn { flex: 1; }
  .form { padding-bottom: 0; }
  .crew-list li span { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.foot .linkbtn { margin-left: auto; color: var(--on-dark); }
</style>
</head>
<body>

  <header class="bar">
    <div class="wrap">
      <div class="brand"><b>Golden Hour Booths</b><span>Crew schedule · internal</span></div>
      <div class="bar-tools">
        <button class="btn small" id="signin-btn" type="button" hidden>Editor sign-in</button>
        <button class="btn small" id="crew-btn" type="button" hidden>Crew list</button>
        <button class="btn small" id="new-btn" type="button" hidden>+ New event</button>
      </div>
    </div>
  </header>


  <section class="hero">
    <div class="wrap"><div id="next"></div></div>
  </section>

  <main class="wrap main">
    <section class="cal" aria-label="Calendar">
      <div class="cal-head">
        <button class="icon" id="prev" type="button" aria-label="Previous month">&#8592;</button>
        <h2 id="month"></h2>
        <button class="icon" id="nextm" type="button" aria-label="Next month">&#8594;</button>
      </div>
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="grid" id="grid"></div>
      <div class="cal-foot">
        <button class="linkbtn" id="today" type="button">Today</button>
        <span class="legend"><i class="dot"></i> Has events</span>
      </div>
    </section>

    <section aria-label="Events">
      <div class="list-head">
        <h2 id="list-title">Upcoming</h2>
        <div class="tools">
          <input class="search" id="q" type="search" placeholder="Search events, places, people" aria-label="Search events">
          <div class="seg" id="views">
            <button type="button" data-view="upcoming" aria-pressed="true">Upcoming</button>
            <button type="button" data-view="past" aria-pressed="false">Past</button>
            <button type="button" data-view="all" aria-pressed="false">All</button>
          </div>
        </div>
        <div class="chips" id="booths" aria-label="Filter by booth"></div>
        <div class="chips" id="pays" aria-label="Filter by payment" hidden></div>
      </div>
      <button class="linkbtn" id="clear-day" type="button" hidden>&#8592; All dates</button>
      <div class="events" id="list"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <b>Golden Hour Booths</b>
      <span>Internal crew schedule. Questions about a shift? Message the Golden Hour Booths team.</span>
      <button class="linkbtn" id="signout" type="button" hidden>Editor sign-out</button>
    </div>
  </footer>

  <dialog id="detail" aria-label="Event details"></dialog>
  <dialog id="editor" aria-label="Edit event"></dialog>
  <dialog id="crew" aria-label="Crew list"></dialog>
  <dialog id="signin" aria-label="Editor sign-in"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  var BOOTHS = [
    { name: "Retro Booth", cls: "b-retro" },
    { name: "Studio Booth", cls: "b-studio" },
    { name: "Enclosed Booth", cls: "b-enclosed" },
    { name: "Roaming Booth", cls: "b-roaming" },
    { name: "360 Booth", cls: "b-360" },
    { name: "Guest Book", cls: "b-guestbook" },
    { name: "Keychain Station", cls: "b-keychain" },
    { name: "Monogram Bar", cls: "b-monogram" }
  ];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var FIELDS = ["title", "status", "date", "arrive", "start", "end", "location", "address", "parking", "entrance", "contact", "assigned", "expect", "setup", "bring", "dress", "link", "notes", "payment", "total", "paid", "paynotes"];
  var PAY = [
    { name: "Not paid", cls: "pay-none" },
    { name: "Deposit paid", cls: "pay-deposit" },
    { name: "Partially paid", cls: "pay-partial" },
    { name: "Paid in full", cls: "pay-full" }
  ];
  var CODE_KEY = "gh-editor-code";

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var data = { crew: [], events: [] }, loaded = false;
  var ui = { view: "upcoming", q: "", booth: "", pay: "", day: null, month: null };
  var canEdit = false, saving = false, code = store.get(CODE_KEY) || "";
  var $ = function (id) { return document.getElementById(id); };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function mins(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function fmt(t) { var v = mins(t); if (v == null) return ""; var h = Math.floor(v / 60); return ((h % 12) || 12) + ":" + pad(v % 60) + " " + (h < 12 ? "AM" : "PM"); }
  function hours(e) { return e.start ? fmt(e.start) + (e.end ? " – " + fmt(e.end) : "") : "Time TBA"; }
  function longDate(d) { return DOW[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate(); }
  function people(e) { return String(e.assigned || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean); }
  function boothCls(name) { var b = BOOTHS.filter(function (x) { return x.name === name; })[0]; return b ? b.cls : ""; }
  function tagsHTML(e) { return (e.booths || []).map(function (b) { return '<span class="tag ' + boothCls(b) + '">' + esc(b) + "</span>"; }).join(""); }
  function endOf(e) { var d = parseDate(e.date); var m = mins(e.end); if (m == null) m = mins(e.start); d.setMinutes(m == null ? 1439 : m); return d; }
  function isPast(e) { return endOf(e) < new Date(); }
  function mapsURL(e) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([e.location, e.address].filter(Boolean).join(", ")); }
  function gcalURL(e) {
    var d = e.date.replace(/-/g, ""), from = e.arrive || e.start, to = e.end, dates;
    if (from) {
      var f = mins(from), t = to ? mins(to) : f + 60;
      var stamp = function (v) { var dd = parseDate(e.date); dd.setMinutes(v); return keyOf(dd).replace(/-/g, "") + "T" + pad(dd.getHours()) + pad(dd.getMinutes()) + "00"; };
      dates = stamp(f) + "/" + stamp(t);
    } else {
      var n = parseDate(e.date); n.setDate(n.getDate() + 1); dates = d + "/" + keyOf(n).replace(/-/g, "");
    }
    var details = [
      (e.booths || []).length ? "Booth: " + e.booths.join(", ") : "",
      e.arrive ? "Arrive " + fmt(e.arrive) + ". Booth " + hours(e) + "." : "",
      e.parking ? "Parking: " + e.parking : "", e.entrance ? "Entrance: " + e.entrance : "",
      e.contact ? "On-site contact: " + e.contact : "", people(e).length ? "Working: " + people(e).join(", ") : "",
      e.expect ? "Expect: " + e.expect : "", e.setup ? "Setup: " + e.setup : "", e.bring ? "Bring: " + e.bring : "",
      e.dress ? "Dress: " + e.dress : "", e.link, e.notes
    ].filter(Boolean).join("\n");
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=America%2FLos_Angeles&text=" + encodeURIComponent("Golden Hour Booths: " + e.title) +
      "&dates=" + dates + "&location=" + encodeURIComponent([e.location, e.address].filter(Boolean).join(", ")) + "&details=" + encodeURIComponent(details);
  }
  function sorted() { return data.events.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (mins(a.start) || 0) - (mins(b.start) || 0); }); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 4500); }
  function payCls(name) { var p = PAY.filter(function (x) { return x.name === name; })[0]; return p ? p.cls : ""; }
  function payBadge(e) { return canEdit && e.payment ? '<span class="pay ' + payCls(e.payment) + '">' + esc(e.payment) + "</span>" : ""; }
  function num(v) { var n = parseFloat(String(v || "").replace(/[$,\s]/g, "")); return isNaN(n) ? null : n; }
  function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
  function balance(e) { var t = num(e.total), p = num(e.paid) || 0; return t == null ? null : Math.max(0, t - p); }
  function safeLink(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function anyOpen() { return Array.prototype.some.call(document.querySelectorAll("dialog"), function (d) { return d.open; }); }

  // ---------- talking to the Google Sheet ----------
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  function apply(d) {
    data = { crew: d.crew || [], events: d.events || [] };
    if (code && !d.editor) { code = ""; store.del(CODE_KEY); toast("The editor passcode has changed. Sign in again to edit."); }
    canEdit = !!d.editor;
    if (!canEdit) ui.pay = "";
    loaded = true;
    render();
  }
  function load() {
    return call("getData", code).then(apply, function () {
      if (!loaded) $("list").innerHTML = '<div class="empty">Couldn&#39;t load the schedule. Check your connection and refresh the page.</div>';
    });
  }
  function run(fn, args, msg) {
    if (saving) return;
    saving = true; setBusy(true);
    call.apply(null, [fn, code].concat(args)).then(function (d) {
      saving = false;
      ["editor", "detail", "crew"].forEach(function (id) { hide($(id)); });
      apply(d);
      toast(msg);
    }, function (err) {
      saving = false; setBusy(false);
      var m = String((err && err.message) || err || "");
      if (/passcode/i.test(m)) { signOut(); toast("Your editor sign-in expired. Sign in again to save."); }
      else toast(/name and a date/.test(m) ? m : "Couldn't save. Check your connection and try again.");
    });
  }
  function setBusy(on) { ["save-btn", "crew-save"].forEach(function (id) { var b = $(id); if (b) { b.disabled = on; if (on) b.textContent = "Saving…"; } }); }
  function signOut() { code = ""; store.del(CODE_KEY); canEdit = false; load(); }

  // ---------- render ----------
  function renderBooths() {
    $("booths").innerHTML = '<button type="button" class="chipbtn" data-booth="" aria-pressed="' + (!ui.booth) + '">All booths</button>' +
      BOOTHS.map(function (b) { return '<button type="button" class="chipbtn ' + b.cls + '" data-booth="' + esc(b.name) + '" aria-pressed="' + (ui.booth === b.name) + '"><i></i>' + esc(b.name) + "</button>"; }).join("");
  }
  function renderPays() {
    $("pays").hidden = !canEdit;
    $("pays").innerHTML = '<button type="button" class="chipbtn pf" data-pay="" aria-pressed="' + (!ui.pay) + '">All payments</button>' +
      PAY.map(function (p) { return '<button type="button" class="chipbtn pf" data-pay="' + esc(p.name) + '" aria-pressed="' + (ui.pay === p.name) + '">' + esc(p.name) + "</button>"; }).join("");
  }
  function payOK(e) { return !ui.pay || e.payment === ui.pay; }
  function boothOK(e) { return !ui.booth || (e.booths || []).indexOf(ui.booth) >= 0; }

  function renderNext() {
    var el = $("next");
    if (!loaded) { el.innerHTML = '<p class="label" style="color:var(--red);margin:0 0 8px">Next up</p><p class="next-empty">Loading the schedule…</p>'; return; }
    var e = sorted().filter(function (x) { return !isPast(x) && x.status !== "Cancelled" && boothOK(x); })[0];
    if (!e) { el.innerHTML = '<p class="label" style="color:var(--red);margin:0 0 8px">Next up</p><p class="next-empty">No upcoming events yet.</p>'; el.onclick = null; return; }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var days = Math.round((parseDate(e.date) - today) / 864e5);
    var big = days === 0 ? '<b class="word">Today</b><span class="label">&nbsp;</span>' : days === 1 ? '<b class="word">Tomorrow</b><span class="label">&nbsp;</span>' : "<b>" + days + '</b><span class="label">days away</span>';
    el.innerHTML = '<div class="next" role="button" tabindex="0" aria-label="Open ' + esc(e.title) + '"><div>' +
      '<p class="label eyebrow">Next up</p><div class="tags" style="margin-bottom:12px">' + tagsHTML(e) + "</div>" +
      "<h1>" + esc(e.title) + "</h1>" +
      '<div class="meta"><span>' + esc(longDate(parseDate(e.date))) + "</span>" + (e.arrive ? "<span><b>Arrive " + esc(fmt(e.arrive)) + "</b></span>" : "") +
      "<span>Booth " + esc(hours(e)) + "</span>" + (e.location ? "<span>" + esc(e.location) + "</span>" : "") + "</div></div>" +
      '<div class="count">' + big + "</div></div>";
    var n = el.querySelector(".next");
    n.onclick = function () { openDetail(e.id); };
    n.onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDetail(e.id); } };
  }

  function renderCal() {
    var m = ui.month;
    $("month").textContent = MONTHS[m.getMonth()] + " " + m.getFullYear();
    var first = new Date(m.getFullYear(), m.getMonth(), 1 - m.getDay());
    var byDay = {};
    data.events.filter(boothOK).forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
    var tk = keyOf(new Date()), html = "";
    for (var i = 0; i < 42; i++) {
      var d = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i), k = keyOf(d), evs = byDay[k] || [];
      var cls = "day" + (d.getMonth() !== m.getMonth() ? " other" : "") + (k === tk ? " today" : "") + (evs.length ? " has" : "") + (k === ui.day ? " sel" : "");
      html += '<button type="button" class="' + cls + '" data-day="' + k + '"' + (evs.length ? ' title="' + esc(evs.map(function (e) { return e.title; }).join(" · ")) + '"' : ' tabindex="-1"') +
        ' aria-label="' + esc(longDate(d)) + (evs.length ? ", " + evs.length + " event" + (evs.length > 1 ? "s" : "") : "") + '"><span class="n">' + d.getDate() + "</span>" +
        (evs.length ? '<span class="dots">' + evs.slice(0, 4).map(function () { return '<i class="dot"></i>'; }).join("") + "</span>" : "") + "</button>";
    }
    $("grid").innerHTML = html;
  }

  function renderList() {
    var title = ui.day ? longDate(parseDate(ui.day)) : (ui.booth ? ui.booth + " · " : "") + (ui.pay ? ui.pay + " · " : "") + { upcoming: "Upcoming", past: "Past events", all: "All events" }[ui.view];
    $("list-title").textContent = title;
    $("clear-day").hidden = !ui.day;
    Array.prototype.forEach.call($("views").children, function (b) { b.setAttribute("aria-pressed", String(!ui.day && b.dataset.view === ui.view)); });
    if (!loaded) { $("list").innerHTML = '<div class="empty">Loading the schedule…</div>'; return; }
    var q = ui.q.toLowerCase();
    var list = sorted().filter(function (e) {
      if (!boothOK(e) || !payOK(e)) return false;
      if (ui.day) { if (e.date !== ui.day) return false; }
      else if (ui.view === "upcoming" && isPast(e)) return false;
      else if (ui.view === "past" && !isPast(e)) return false;
      if (q) {
        var hay = FIELDS.map(function (f) { return e[f] || ""; }).concat(e.booths || []).join(" ").toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    if (ui.view === "past" && !ui.day) list.reverse();
    if (!list.length) {
      var msg = ui.day ? "No events on this day." : ui.q ? "No events match “" + esc(ui.q) + "”." : data.events.length ? "Nothing here." : "No events yet.";
      $("list").innerHTML = '<div class="empty"><span>' + msg + "</span>" + (canEdit && !data.events.length ? '<button class="btn solid" type="button" data-new>+ Add the first event</button>' : "") + "</div>";
      return;
    }
    var html = "", last = "";
    list.forEach(function (e) {
      var d = parseDate(e.date), mk = MONTHS[d.getMonth()] + " " + d.getFullYear();
      if (!ui.day && mk !== last) { html += '<div class="label month">' + mk + "</div>"; last = mk; }
      var cls = "card" + (isPast(e) ? " past" : "") + (e.status === "Cancelled" ? " cancelled" : "");
      html += '<button type="button" class="' + cls + '" data-id="' + esc(e.id) + '">' +
        '<div class="date"><span class="m">' + MONTHS[d.getMonth()].slice(0, 3) + '</span><span class="d">' + d.getDate() + '</span><span class="w">' + DOW[d.getDay()] + "</span></div>" +
        '<div class="cbody">' + ((e.booths || []).length ? '<div class="tags">' + tagsHTML(e) + "</div>" : "") +
        '<div class="ctop"><h3>' + esc(e.title) + '</h3><span class="badges">' + (e.status && e.status !== "Confirmed" ? '<span class="status ' + esc(e.status) + '">' + esc(e.status) + "</span>" : "") + payBadge(e) + "</span></div>" +
        '<div class="facts">' + (e.arrive ? '<span class="arrive">Arrive ' + esc(fmt(e.arrive)) + "</span>" : "") + "<span>Booth " + esc(hours(e)) + "</span>" + (e.location ? "<span>" + esc(e.location) + "</span>" : "") + "</div>" +
        (people(e).length ? '<div class="people">' + people(e).map(function (p) { return '<span class="person">' + esc(p) + "</span>"; }).join("") + "</div>" : "") +
        "</div></button>";
    });
    $("list").innerHTML = html;
  }

  function render() {
    renderBooths(); renderPays(); renderNext(); renderCal(); renderList();
    $("new-btn").hidden = !canEdit; $("crew-btn").hidden = !canEdit;
    $("signin-btn").hidden = canEdit || !loaded; $("signout").hidden = !canEdit;
  }

  // ---------- event details ----------
  function find(id) { return data.events.filter(function (e) { return e.id === id; })[0]; }

  function openDetail(id) {
    var e = find(id); if (!e) return;
    var row = function (label, html) { return html ? '<div class="row"><dt>' + label + "</dt><dd>" + html + "</dd></div>" : ""; };
    var sec = function (title, rows) { return rows ? '<p class="label sec">' + title + "</p><dl>" + rows + "</dl>" : ""; };
    var venue = e.location || e.address ? '<span class="venue">' + esc(e.location) + "</span>" + (e.address ? '\n<span class="sub">' + esc(e.address) + "</span>" : "") + '\n<a href="' + mapsURL(e) + '" target="_blank" rel="noopener">Open in Google Maps &#8599;</a>' : "";
    var contact = e.contact ? esc(e.contact) + ' <button class="linkbtn copy" type="button" data-copy="' + esc(e.contact) + '">Copy</button>' : "";
    var team = people(e).length ? '<div class="people">' + people(e).map(function (p) { return '<span class="person">' + esc(p) + "</span>"; }).join("") + "</div>" : "Not assigned yet";
    var link = safeLink(e.link), d = parseDate(e.date);
    var payment = canEdit ? sec("Payment", (e.payment ? row("Status", payBadge(e)) : "") +
      (num(e.total) != null ? row("Total", '<span class="money">' + money(num(e.total)) + "</span>") : "") +
      (num(e.paid) != null ? row("Paid so far", '<span class="money">' + money(num(e.paid)) + "</span>") : "") +
      (balance(e) != null ? row("Balance due", '<span class="money' + (balance(e) > 0 ? " due" : "") + '">' + money(balance(e)) + "</span>") : "") +
      row("Payment notes", esc(e.paynotes))) : "";
    $("detail").innerHTML =
      '<div class="d-head"><p class="label eyebrow" style="margin:0">' + esc(e.status || "Confirmed") + "</p>" +
      '<div class="tags">' + tagsHTML(e) + "</div><h3>" + esc(e.title) + "</h3>" +
      (canEdit ? '<button class="btn small head-edit" type="button" data-edit="' + esc(e.id) + '">Edit this event</button>' : "") +
      '<button class="x" type="button" data-close aria-label="Close">&times;</button></div>' +
      '<div class="times"><div><span>Date</span><b>' + DOW[d.getDay()] + ", " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getDate() + "</b></div>" +
      (e.arrive ? '<div class="hl"><span>Arrive</span><b>' + esc(fmt(e.arrive)) + "</b></div>" : "") +
      "<div><span>Booth hours</span><b>" + esc(hours(e)) + "</b></div></div>" +
      '<div class="d-body">' +
      sec("Getting there", row("Venue", venue) + row("Parking", esc(e.parking)) + row("Entrance", esc(e.entrance))) +
      sec("The event", row("Expect", esc(e.expect)) + row("Booth setup", esc(e.setup)) + row("Bring", esc(e.bring)) + row("Dress code", esc(e.dress))) +
      sec("Team", row("Working", team) + row("On-site contact", contact)) +
      payment +
      sec("More", row("Link", link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link.replace(/^https?:\/\//, "")) + " &#8599;</a>" : "") + row("Notes", esc(e.notes))) +
      '<div class="actions">' +
      (e.location || e.address ? '<a class="btn solid" href="' + mapsURL(e) + '" target="_blank" rel="noopener">Directions</a>' : "") +
      (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Open link</a>' : "") +
      '<a class="btn" href="' + gcalURL(e) + '" target="_blank" rel="noopener">Add to Google Calendar</a></div>' +
      (canEdit ? '<div class="edit-actions"><button class="btn small" type="button" data-edit="' + esc(e.id) + '">Edit</button>' +
        '<button class="btn small" type="button" data-dup="' + esc(e.id) + '">Duplicate</button>' +
        '<button class="btn small danger" type="button" data-del="' + esc(e.id) + '">Delete</button></div>' : "") +
      "</div>";
    show($("detail"));
  }

  function show(dlg) { if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", ""); dlg.scrollTop = 0; }
  function hide(dlg) { if (!dlg) return; if (dlg.close) { if (dlg.open) dlg.close(); } else dlg.removeAttribute("open"); }

  // ---------- add / edit form ----------
  function openEditor(e) {
    var isNew = !e || !find(e.id);
    e = e || { status: "Confirmed", booths: [] };
    var v = function (f) { return esc(e[f] || ""); };
    var onEvent = people(e);
    var crewNames = data.crew.concat(onEvent.filter(function (p) { return data.crew.indexOf(p) < 0; }));
    var f = function (id, label, html, full) { return '<div class="field' + (full ? " full" : "") + '"><label for="f-' + id + '">' + label + "</label>" + html + "</div>"; };
    var inp = function (id, type, ph) { return '<input id="f-' + id + '" name="' + id + '" type="' + (type || "text") + '" value="' + v(id) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + ">"; };
    var area = function (id, ph) { return '<textarea id="f-' + id + '" name="' + id + '" placeholder="' + esc(ph) + '">' + v(id) + "</textarea>"; };
    $("editor").innerHTML =
      '<div class="d-head"><p class="label eyebrow" style="margin:0">' + (isNew ? "New event" : "Edit event") + "</p><h3>" + (isNew ? "Add an event" : esc(e.title)) + '</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>' +
      '<form class="form" id="ev-form" novalidate data-id="' + esc(isNew ? "" : e.id) + '">' +
      '<p class="label sec">Basics</p>' +
      f("title", "Event name", inp("title", "text", "Kim & Daniel Wedding"), true) +
      '<div class="field full"><span>Booth</span><div class="checks">' + BOOTHS.map(function (b, i) {
        return '<label><input type="checkbox" id="f-booth-' + i + '" name="booth" value="' + esc(b.name) + '"' + ((e.booths || []).indexOf(b.name) >= 0 ? " checked" : "") + "> " + esc(b.name) + "</label>";
      }).join("") + "</div></div>" +
      f("date", "Date", inp("date", "date")) +
      f("status", "Status", '<select id="f-status" name="status">' + ["Confirmed", "Tentative", "Cancelled"].map(function (s) { return "<option" + (e.status === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select>") +
      '<p class="label sec">Times</p>' +
      f("arrive", "Arrive / load-in", inp("arrive", "time")) + f("start", "Booth opens", inp("start", "time")) + f("end", "Booth closes", inp("end", "time")) +
      '<p class="label sec">Getting there</p>' +
      f("location", "Venue", inp("location", "text", "Fairmont Olympic Hotel")) + f("address", "Address <small>(for directions)</small>", inp("address", "text", "411 University St, Seattle, WA")) +
      f("parking", "Parking", area("parking", "Where to park, cost, validation"), true) + f("entrance", "Entrance / load-in", area("entrance", "Which door or dock, elevator, who lets you in"), true) +
      '<p class="label sec">The event</p>' +
      f("expect", "What to expect", area("expect", "Type of event, guest count, timeline"), true) + f("setup", "Booth setup", area("setup", "Backdrop, print template, props, prints or digital"), true) +
      f("bring", "What to bring", area("bring", "Kits, props, cords"), true) + f("dress", "Dress code", inp("dress", "text", "All black")) +
      '<p class="label sec">Team</p>' +
      '<div class="field full"><span>Who&#39;s working</span><div class="checks">' + (crewNames.length ? crewNames.map(function (n, i) {
        return '<label><input type="checkbox" id="f-crew-' + i + '" name="crew" value="' + esc(n) + '"' + (onEvent.indexOf(n) >= 0 ? " checked" : "") + "> " + esc(n) + "</label>";
      }).join("") : "<small>No crew yet. Add names with the Crew list button at the top.</small>") + "</div></div>" +
      f("contact", "On-site contact <small>(name and phone)</small>", inp("contact", "text", "Jess (planner) 206-555-0101"), true) +
      '<p class="label sec">Payment <small style="text-transform:none;letter-spacing:.02em;color:var(--muted)">(only editors see this)</small></p>' +
      f("payment", "Payment status", '<select id="f-payment" name="payment"><option value="">Not set</option>' + PAY.map(function (p) { return "<option" + (e.payment === p.name ? " selected" : "") + ">" + p.name + "</option>"; }).join("") + "</select>", true) +
      f("total", "Total price <small>($)</small>", '<input id="f-total" name="total" type="text" inputmode="decimal" value="' + v("total") + '" placeholder="1200">') +
      f("paid", "Paid so far <small>($)</small>", '<input id="f-paid" name="paid" type="text" inputmode="decimal" value="' + v("paid") + '" placeholder="300">') +
      f("paynotes", "Payment notes", area("paynotes", "Deposit paid Oct 2 by Venmo. Rest due the day of the event."), true) +
      '<p class="label sec">More</p>' +
      f("link", "Link <small>(run of show, folder, template)</small>", inp("link", "url", "https://"), true) + f("notes", "Notes", area("notes", ""), true) +
      '<div class="form-foot"><button class="btn solid" type="submit" id="save-btn">' + (isNew ? "Add event" : "Save changes") + '</button><button class="btn" type="button" data-close>Cancel</button><span class="err" id="form-err" role="alert"></span></div>' +
      "</form>";
    show($("editor"));
    var t = $("f-title"); if (t && !e.title) t.focus();
  }

  function readForm() {
    var form = $("ev-form"), e = { id: form.dataset.id || "" };
    FIELDS.forEach(function (f) { var el = form.elements[f]; e[f] = el ? el.value.trim() : ""; });
    e.booths = Array.prototype.filter.call(form.querySelectorAll('input[name="booth"]'), function (c) { return c.checked; }).map(function (c) { return c.value; });
    e.assigned = Array.prototype.filter.call(form.querySelectorAll('input[name="crew"]'), function (c) { return c.checked; }).map(function (c) { return c.value; }).join(", ");
    return e;
  }

  // ---------- crew list ----------
  var crewDraft = [];
  function openCrew() { crewDraft = data.crew.map(function (n) { return { name: n, removed: false }; }); renderCrew(); show($("crew")); }
  function renderCrew() {
    var changed = crewDraft.some(function (c) { return c.removed || c.added; });
    $("crew").innerHTML =
      '<div class="d-head"><p class="label eyebrow" style="margin:0">Team</p><h3>Crew list</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>' +
      '<div class="d-body"><ul class="crew-list">' + crewDraft.map(function (c, i) {
        return '<li class="' + (c.removed ? "removed" : "") + '"><span>' + esc(c.name) + "</span>" +
          '<button class="btn small' + (c.removed ? "" : " danger") + '" type="button" data-crew-toggle="' + i + '">' + (c.removed ? "Undo" : "Remove") + "</button></li>";
      }).join("") + "</ul>" +
      '<form class="crew-add" id="crew-add"><input id="crew-name" type="text" placeholder="Add a name" aria-label="New crew member name" autocomplete="off"><button class="btn" type="submit">Add</button></form>' +
      '<p class="hint">Removing a name takes it off this list. Events they already worked keep their name.</p>' +
      '<div class="actions"><button class="btn solid" type="button" id="crew-save"' + (changed ? "" : " disabled") + '>Save crew list</button><button class="btn" type="button" data-close>Cancel</button></div></div>';
  }

  // ---------- editor sign-in ----------
  function openSignin() {
    $("signin").innerHTML =
      '<div class="d-head"><p class="label eyebrow" style="margin:0">Editors</p><h3>Editor sign-in</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>' +
      '<form class="d-body" id="signin-form"><p class="hint" style="margin-top:16px">Enter the crew passcode to add, edit and delete events. Ask Golden Hour Booths if you don&#39;t have it.</p>' +
      '<div class="field" style="margin-top:12px"><label for="f-code">Passcode</label><input id="f-code" type="password" autocomplete="current-password" required></div>' +
      '<div class="actions"><button class="btn solid" type="submit" id="signin-go">Sign in</button><button class="btn" type="button" data-close>Cancel</button><span class="err" id="signin-err" role="alert"></span></div></form>';
    show($("signin"));
    $("f-code").focus();
  }

  // ---------- clicks and forms ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var c = t.closest("[data-close]"); if (c) { hide(c.closest("dialog")); return; }
    if (t.tagName === "DIALOG") { hide(t); return; }
    var card = t.closest(".card"); if (card) { openDetail(card.dataset.id); return; }
    var day = t.closest(".day.has"); if (day) { ui.day = ui.day === day.dataset.day ? null : day.dataset.day; render(); if (ui.day && innerWidth < 860) $("list-title").scrollIntoView({ block: "start" }); return; }
    var bt = t.closest("[data-booth]"); if (bt) { ui.booth = bt.dataset.booth; render(); return; }
    var pt = t.closest("[data-pay]"); if (pt) { ui.pay = pt.dataset.pay; render(); return; }
    var vw = t.closest("[data-view]"); if (vw) { ui.view = vw.dataset.view; ui.day = null; render(); return; }
    if (t.closest("#prev")) { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() - 1, 1); renderCal(); return; }
    if (t.closest("#nextm")) { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + 1, 1); renderCal(); return; }
    if (t.closest("#today")) { var n = new Date(); ui.month = new Date(n.getFullYear(), n.getMonth(), 1); ui.day = null; render(); return; }
    if (t.closest("#clear-day")) { ui.day = null; render(); return; }
    if (t.closest("#signin-btn")) { openSignin(); return; }
    if (t.closest("#signout")) { signOut(); toast("Signed out. You can still view the schedule."); return; }
    if (t.closest("#new-btn") || t.closest("[data-new]")) { openEditor(null); return; }
    if (t.closest("#crew-btn")) { openCrew(); return; }
    var ct = t.closest("[data-crew-toggle]");
    if (ct) { var ci = +ct.dataset.crewToggle, cm = crewDraft[ci]; if (cm.added) crewDraft.splice(ci, 1); else cm.removed = !cm.removed; renderCrew(); return; }
    if (t.closest("#crew-save")) { run("saveCrew", [crewDraft.filter(function (x) { return !x.removed; }).map(function (x) { return x.name; })], "Crew list saved."); return; }
    var cp = t.closest("[data-copy]");
    if (cp) {
      var done = function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy"; }, 2000); };
      try { navigator.clipboard.writeText(cp.dataset.copy).then(done, function () {}); } catch (e) {}
      return;
    }
    var ed = t.closest("[data-edit]"); if (ed) { hide($("detail")); openEditor(JSON.parse(JSON.stringify(find(ed.dataset.edit)))); return; }
    var du = t.closest("[data-dup]");
    if (du) { var copy = JSON.parse(JSON.stringify(find(du.dataset.dup))); delete copy.id; copy.title += " (copy)"; hide($("detail")); openEditor(copy); return; }
    var de = t.closest("[data-del]");
    if (de) {
      if (de.dataset.armed) { de.disabled = true; de.textContent = "Deleting…"; run("deleteEvent", [de.dataset.del], "Event deleted."); }
      else { de.dataset.armed = "1"; de.textContent = "Tap again to delete"; }
    }
  });

  document.addEventListener("submit", function (ev) {
    var id = ev.target.id;
    if (id === "crew-add") {
      ev.preventDefault();
      var name = $("crew-name").value.trim().replace(/\s+/g, " ");
      if (!name) return;
      var dup = crewDraft.filter(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })[0];
      if (dup) dup.removed = false; else crewDraft.push({ name: name, removed: false, added: true });
      renderCrew(); $("crew-name").focus();
    } else if (id === "signin-form") {
      ev.preventDefault();
      var val = $("f-code").value.trim();
      if (!val) return;
      $("signin-go").disabled = true;
      call("checkCode", val).then(function (ok) {
        if (!ok) { $("signin-go").disabled = false; $("signin-err").textContent = "That passcode isn't right."; return; }
        code = val; store.set(CODE_KEY, val); hide($("signin"));
        load().then(function () { toast("You're signed in as an editor."); });
      }, function () { $("signin-go").disabled = false; $("signin-err").textContent = "Couldn't check the passcode. Try again."; });
    } else if (id === "ev-form") {
      ev.preventDefault();
      var e = readForm();
      if (!e.title || !e.date) { $("form-err").textContent = "Add an event name and a date."; return; }
      if ((e.total && num(e.total) == null) || (e.paid && num(e.paid) == null)) { $("form-err").textContent = "Enter amounts as numbers, like 1200 or 350.50."; return; }
      run("saveEvent", [e], e.id ? "Changes saved." : "Event added.");
    }
  });

  document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target.closest && ev.target.closest(".day.has")) { ev.preventDefault(); ev.target.click(); } });
  $("q").addEventListener("input", function () { ui.q = this.value.trim(); renderList(); });

  // ---------- start ----------
  var now = new Date();
  ui.month = new Date(now.getFullYear(), now.getMonth(), 1);
  render();
  load();
  // pick up other people's changes every minute (skipped while a form is open)
  setInterval(function () { if (!saving && !anyOpen() && !document.hidden) load(); }, 60000);
})();

</script>
</body>
</html>
